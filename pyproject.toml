[project]
name = "sysmon-agent"
version = "1.3.0"
description = "Cross-platform system + login-session monitoring agent that ships metrics and events to an OTLP/HTTP collector."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["monitoring", "opentelemetry", "otlp", "sessions", "systemd", "windows-service"]

dependencies = [
    "psutil>=5.9",
    "opentelemetry-sdk>=1.24.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0,<2",
    "requests>=2.28",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
sysmon-agent = "sysmon_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysmon_agent"]
